name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        id: setup-dotnet
        with:
          dotnet-version: '8.0.x'
      # ランナーには新しい SDK も入っているため、setup-dotnet が入れた .NET 8 の SDK に固定する（setup-dotnet の README の手順）
      - name: .NET 8 の SDK に固定する
        env:
          DOTNET_SDK_VERSION: ${{ steps.setup-dotnet.outputs.dotnet-version }}
        run: |
          test -n "$DOTNET_SDK_VERSION"
          printf '{"sdk":{"version":"%s"}}\n' "$DOTNET_SDK_VERSION" > global.json
      - name: Domain Core のテスト
        run: |
          dotnet --version
          dotnet test src/core/DomainCore.Tests

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: src/backend
      - name: テスト用 DB の準備
        run: bin/rails db:prepare
      - name: RSpec
        run: bundle exec rspec
