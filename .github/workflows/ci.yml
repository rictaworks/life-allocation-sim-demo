name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Domain Core のテスト
        run: dotnet test src/core/DomainCore.Tests

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: src/backend
      - name: テスト用 DB の準備
        run: bin/rails db:prepare
      - name: RSpec
        run: bundle exec rspec
