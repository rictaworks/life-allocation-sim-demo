default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      # この設定は Solid Queue を使うときだけ読まれる（Gemfile に無いため、現在は読まれない）。環境変数では上書きしない。
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
