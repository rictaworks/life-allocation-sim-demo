# SQLite。保存先は DATABASE_PATH（絶対パス。本番は Railway のボリューム上）。
# 既定値では補わない。起動時の検査（config/app_settings.rb）で存在と形式を確かめる。
#
# SQLite の書き込みは既定で BEGIN IMMEDIATE（件数の判定と記録を直列にする）。
# 接続数は config/server.yml（database.max_connections）。RAILS_MAX_THREADS が設定されていれば、その値を使う。
default: &default
  adapter: sqlite3
  database: <%= ENV.fetch("DATABASE_PATH") %>
  max_connections: <%= ServerSettings.database_max_connections %>
  timeout: 5000

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
